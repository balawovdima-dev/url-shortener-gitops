# Loki, log storage. Values: monitoring/values/loki.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 7.3.0 # pinned; bump deliberately
      helm:
        releaseName: loki
        valueFiles:
          - $values/monitoring/values/loki.yaml
    - repoURL: https://github.com/balawovdima-dev/url-shortener-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
