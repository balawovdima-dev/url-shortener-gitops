# Prometheus, Alertmanager and Grafana. Values: monitoring/values/kube-prometheus-stack.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.1.1 # pinned; bump deliberately
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/monitoring/values/kube-prometheus-stack.yaml
    - repoURL: https://github.com/balawovdima-dev/url-shortener-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # the CRDs are too big for client-side apply's annotation
