apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  labels:
    {{- include "url-shortener.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
data: # non-sensitive settings
  BASE_URL: {{ required "publicUrl is required (e.g. --set publicUrl=https://supabase.win)" .Values.publicUrl | quote }}
  {{- range $k, $v := .Values.backend.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
