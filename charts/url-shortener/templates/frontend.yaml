{{- $f := .Values.frontend -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    {{- include "url-shortener.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ $f.replicas }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          {{- include "url-shortener.image" $f.image | nindent 10 }}
          ports:
            - containerPort: {{ $f.containerPort }} # Next.js default
          # No API URL env: the browser calls relative /api/*, which the Ingress
          # routes to the backend. NEXT_PUBLIC_* is baked in at build time anyway.
          readinessProbe:
            httpGet:
              path: /
              port: {{ $f.containerPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml $f.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    {{- include "url-shortener.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: {{ $f.containerPort }}
