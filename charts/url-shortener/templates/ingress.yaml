{{- if .Values.ingress.enabled -}}
# Two Ingresses because Traefik ranks routes by rule length, not by pathType:
# the backend's PathPrefix(`/`) would beat the frontend's Path(`/`). A
# router.priority annotation applies to a whole Ingress, so the frontend's
# paths get their own Ingress with a higher priority.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: url-shortener-frontend
  labels:
    {{- include "url-shortener.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.priority: "1000"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tlsSecret }}
  {{- include "url-shortener.ingressTLS" . | nindent 2 }}
  {{- end }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          # Frontend owns only its page and assets...
          {{- include "url-shortener.ingressPath" (dict "path" "/" "type" "Exact" "svc" "frontend") | nindent 10 }}
          {{- include "url-shortener.ingressPath" (dict "path" "/_next" "type" "Prefix" "svc" "frontend") | nindent 10 }}
          {{- include "url-shortener.ingressPath" (dict "path" "/favicon.ico" "type" "Exact" "svc" "frontend") | nindent 10 }}
          # Metrics are for Prometheus, which scrapes the pods directly: from
          # the internet, /metrics lands on the frontend and gets a 404.
          {{- include "url-shortener.ingressPath" (dict "path" "/metrics" "type" "Exact" "svc" "frontend") | nindent 10 }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: url-shortener
  labels:
    {{- include "url-shortener.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tlsSecret }}
  {{- include "url-shortener.ingressTLS" . | nindent 2 }}
  {{- end }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          # ...everything else (/api/*, /healthz, /<code> redirects) is the backend.
          {{- include "url-shortener.ingressPath" (dict "path" "/" "type" "Prefix" "svc" "backend") | nindent 10 }}
{{- end }}
