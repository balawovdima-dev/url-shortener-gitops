# Origin the browser uses to reach the Ingress; the backend builds short links from it (BASE_URL).
# Required, e.g. --set publicUrl=https://supabase.win
publicUrl: ""

backend:
  replicas: 2
  image:
    repository: ghcr.io/balawovdima-dev/url-shortener-backend
    tag: latest # overridden per environment in values-<env>.yaml with a git SHA
    pullPolicy: "" # empty = Kubernetes default (Always for :latest)
  containerPort: 8000
  # Secret with DATABASE_URL, created outside the chart so credentials never land in release history.
  existingSecret: backend-secret
  # Run `alembic upgrade head` as a Helm hook before every install/upgrade.
  migrations:
    enabled: true
  # Extra non-sensitive env vars, rendered into the backend-config ConfigMap.
  config:
    LOG_LEVEL: info
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

frontend:
  replicas: 2
  image:
    repository: ghcr.io/balawovdima-dev/url-shortener-frontend
    tag: latest
    pullPolicy: ""
  containerPort: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

ingress:
  enabled: true
  className: traefik # k3s bundled controller
  host: "" # empty = match any host
  # kubernetes.io/tls Secret for `host`, created outside the chart (the
  # Cloudflare Origin CA cert, see scripts/bootstrap-cluster.sh). Empty = no TLS.
  # With TLS set, Traefik serves these routes on 443 only.
  tlsSecret: ""
