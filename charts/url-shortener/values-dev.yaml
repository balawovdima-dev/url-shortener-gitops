# dev: https://dev.supabase.win, namespace url-shortener-dev (apps/dev.yaml).
# Layered over values.yaml. Edit + push = deploy.
publicUrl: https://dev.supabase.win

backend:
  image:
    tag: e258dc3 # urlshortener-pet commit; dev first, then promote to prod
  config:
    LOG_LEVEL: info
    # Alert test: half of dev's requests return 500. Revert this commit to stop.
    CHAOS_ERROR_RATE: "0.5"
  replicas: 2

frontend:
  image:
    tag: e258dc3
  replicas: 1

ingress:
  host: dev.supabase.win
  tlsSecret: origin-tls # Cloudflare Origin CA cert, created by the infra bootstrap
