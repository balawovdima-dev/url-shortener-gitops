# Loki (apps/loki.yaml): one process, chunks and index on the node's disk.
# Enough for one node and a week of logs; object storage (S3) only pays off
# with several replicas.
deploymentMode: SingleBinary

loki:
  auth_enabled: false # single tenant; reachable only inside the cluster
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 168h # 7 days, same as Prometheus
  compactor:
    retention_enabled: true # the compactor is what actually deletes old logs
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: local-path
    size: 10Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 768Mi

# Scalable/microservice components and caches are for multi-node setups.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
chunksCache:
  enabled: false
resultsCache:
  enabled: false
gateway:
  enabled: false # Grafana and Alloy talk to the loki Service directly
lokiCanary:
  enabled: false
test:
  enabled: false
