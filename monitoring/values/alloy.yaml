# Grafana Alloy (apps/alloy.yaml): ships container logs to Loki. It replaces
# Promtail, which reached end of life in March 2026.
#
# Logs are read through the Kubernetes API (loki.source.kubernetes), not
# from the node's files: no hostPath mounts, no root. One replica is enough
# for one node; a DaemonSet would ship every line once per replica.
controller:
  type: deployment
  replicas: 1

alloy:
  resources:
    requests:
      cpu: 20m
      memory: 96Mi
    limits:
      memory: 256Mi
  configMap:
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // Labels to search by in Grafana: namespace, app, pod, container.
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app", "__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          separator     = ""
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
        }
      }
